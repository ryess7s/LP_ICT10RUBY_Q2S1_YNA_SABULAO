<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght @400;600&display=swap" rel="stylesheet">

    <title> Glee Club </title>

    <style>
        body{background-image: url(purple background.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;}
        
        .container{background-color: rgb(255, 248, 233);
                margin: auto;
                padding: 25px;
                border-radius: 16px;
                width: 400px;
                height: 500px;
                text-align: center;
                font-family: Georgia, 'Times New Roman', Times, serif;
                justify-content: center;  }

    </style>
</head>
<body>
<div>
        <div class="container">
            
    <header>
        <div class="reactor"></div>
        <h1> The Professional Glee Club </h1>
        <p> An avenue for passionate singers to showcase their skill and talent</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your first name">
            <br><br>
            <input type="text" id="last_name" placeholder="Enter your last name">
            <br><br>
            <input type="button" py-click="candidate_checker" value="Enter">
        </form>
        <div id="result"></div>
    </main>
            
        </div>
</div>
    
    <py-script src="main.py"></py-script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
</body>
</html>
